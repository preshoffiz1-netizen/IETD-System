{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block page_title %}My Profile{% endblock %}
{% block content %}

<div class="card" style="max-width:480px;"><div class="card-body">
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3"><label class="form-label">Full name</label><input class="form-control" name="full_name" value="{{ current_user.full_name }}"></div>
        <div class="mb-3"><label class="form-label">Email</label><input class="form-control" value="{{ current_user.email }}" disabled></div>
        <div class="mb-3"><label class="form-label">Role</label><input class="form-control" value="{{ current_user.role }}" disabled></div>
        <div class="mb-3"><label class="form-label">New password <small class="text-muted">(leave blank to keep current)</small></label><input class="form-control" type="password" name="new_password" minlength="10"></div>
        <button class="btn btn-primary">Save Profile</button>
    </form>
</div></div>
{% endblock %}
