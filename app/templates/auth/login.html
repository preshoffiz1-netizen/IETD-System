{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block auth_content %}
<div class="auth-card">
    <div class="text-center mb-4">
        <i class="fa-solid fa-shield-halved fa-2x" style="color:#2e7dfd;"></i>
        <h4 class="mt-2 mb-0">{{ app_name }}</h4>
        <small class="text-muted">{{ app_tagline }}</small>
    </div>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
            <label class="form-label">Email address</label>
            <input type="email" class="form-control" name="email" required autofocus>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" name="password" required>
        </div>
        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" name="remember" id="remember">
            <label class="form-check-label" for="remember">Remember me</label>
        </div>
        <button type="submit" class="btn btn-primary w-100">Log in</button>
    </form>
    <p class="text-center mt-3 mb-0"><small>No account? <a href="{{ url_for('auth.register') }}">Create one</a></small></p>
</div>
{% endblock %}
